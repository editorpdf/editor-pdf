<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Editor de PDF</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--tx:#1b1b2f;--mut:#6b6b85;--bd:#e3e5f1;--ac:#4f46e5;--ac2:#4338ca;--on:#15803d;--off:#b91c1c;--warn:#a15c00;--soft:#eceefb;--code:#12122a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12121c;--card:#1c1c2b;--tx:#ececf8;--mut:#9a9ab5;--bd:#2c2c42;--ac:#7c75ff;--ac2:#6d66f0;--on:#4ade80;--off:#f87171;--warn:#fbbf24;--soft:#26263a;--code:#0b0b16}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
main{max-width:520px;margin:0 auto;padding:16px;display:grid;gap:12px}
header{display:flex;align-items:center;gap:10px;padding:2px 2px 4px}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;flex:1}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.status{display:flex;align-items:center;gap:14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--off);box-shadow:0 0 0 5px color-mix(in srgb,var(--off) 18%,transparent);flex:none;transition:.25s}
.on .dot{background:var(--on);box-shadow:0 0 0 5px color-mix(in srgb,var(--on) 20%,transparent)}
.status h2{margin:0;font-size:19px;font-weight:600}
.status p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.status .sp{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--soft);color:var(--tx);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button:hover:not(:disabled){filter:brightness(.96)}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--ac);color:#fff}
button.pri:hover:not(:disabled){background:var(--ac2);filter:none}
button.big{padding:12px 16px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin:0 0 8px;font-weight:600}
.addr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;margin-top:6px;font-family:Consolas,monospace;font-size:12.5px;-webkit-user-select:text;user-select:text}
.addr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr button{padding:4px 10px;font-size:12px;flex:none}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0}
.sw+.sw{border-top:1px solid var(--bd)}
.sw b{display:block;font-weight:500}
.sw small{color:var(--mut);font-size:12px}
.sw>div{flex:1}
.tg{position:relative;width:42px;height:24px;flex:none}
.tg input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.tg i{position:absolute;inset:0;background:var(--bd);border-radius:12px;transition:.2s}
.tg i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.tg input:checked+i{background:var(--ac)}
.tg input:checked+i::after{left:21px}
.tg input:disabled{cursor:default}
.tg.busy i{opacity:.55}
.warn{color:var(--warn);font-size:12px;margin:6px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mut)}
.chip.ok{color:var(--on)}
.chip.no{color:var(--off)}
pre{margin:0;max-height:240px;overflow:auto;background:var(--code);color:#cfd0e8;padding:12px;border-radius:10px;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:none;padding:6px 12px;font-size:13px}
.tabs button.sel{background:var(--ac);color:#fff}
#msg{min-height:20px;font-size:12.5px;color:var(--mut);padding:0 4px}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite;display:none}
.busy .spin,button.busy .spin{display:inline-block}
@keyframes g{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <header><div class="logo">PDF</div><h1>Painel do Editor de PDF</h1></header>

  <section class="card status" id="st">
    <div class="dot"></div>
    <div><h2 id="stT">Verificando…</h2><p id="stP">&nbsp;</p></div>
    <div class="sp"></div>
    <button class="pri" id="bTog" disabled><span class="spin"></span><span id="bTogT">Ligar</span></button>
  </section>

  <button class="pri big" id="bOpen" disabled><span class="spin"></span>Abrir o editor</button>

  <section class="card">
    <p class="lbl">Endereços</p>
    <div class="addr"><span id="aLoc">—</span><button data-copy="aLoc">Copiar</button></div>
    <div class="addr hide" id="aRedeBox"><span id="aRede">—</span><button data-copy="aRede">Copiar</button></div>
    <p class="warn hide" id="wRede">Sem senha: quem estiver na sua rede e souber o endereço usa o editor.</p>
  </section>

  <section class="card" style="padding:6px 16px">
    <label class="sw"><div><b>Compartilhar na rede</b><small>Outros computadores da sua rede acessam o editor</small></div>
      <span class="tg" id="tgRede"><input type="checkbox" id="kRede"><i></i></span></label>
    <label class="sw"><div><b>Iniciar com o Windows</b><small>Liga o servidor sozinho ao entrar no computador</small></div>
      <span class="tg" id="tgIni"><input type="checkbox" id="kIni"><i></i></span></label>
  </section>

  <section class="card">
    <p class="lbl">Recursos <span id="rec0" style="font-weight:400;text-transform:none;letter-spacing:0"></span></p>
    <div class="chips" id="chips"><span class="chip">servidor desligado</span></div>
    <p class="lbl" style="margin-top:14px">Última atividade</p>
    <div id="ult" style="font-size:13px">—</div>
  </section>

  <section class="card">
    <div class="tabs">
      <button id="tLog" class="sel">Registros</button>
      <button id="tVer">Verificar instalação</button>
      <button id="tPas">Pastas</button>
    </div>
    <pre id="saida">Abra a aba para ver.</pre>
    <div class="row hide" id="pastas" style="margin-top:8px">
      <button data-pasta="dados">Abrir pasta dos dados</button>
      <button data-pasta="sistema">Abrir pasta do programa</button>
    </div>
  </section>
  <div id="msg"></div>
</main>

<script>
const $ = s => document.querySelector(s);
let E = null, aba = 'log', busy = {};
try { const t = localStorage.getItem('painel-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const msg = t => { $('#msg').textContent = t || ''; };
async function post(acao, extra) {
  const r = await fetch('/api/acao', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({acao, ...extra})});
  return r.json();
}
// dispara uma ação demorada: mostra "ocupado" e espera o servidor do painel terminar, sem travar a janela
async function tarefa(nome, acao, extra, aoFim) {
  if (busy[nome]) return;
  busy[nome] = true; render();
  try {
    await post(acao, extra);
    for (let i = 0; i < 600; i++) {
      await new Promise(r => setTimeout(r, 250));
      const t = await (await fetch('/api/trabalho?nome=' + nome)).json();
      if (t.fim) { if (aoFim) aoFim(t.texto); else msg(t.texto); break; }
    }
  } catch (e) { msg('Erro: ' + e.message); }
  busy[nome] = false; await atualiza();
}

function chip(t, ok) { return `<span class="chip ${ok === true ? 'ok' : ok === false ? 'no' : ''}">${ok === true ? '✓ ' : ok === false ? '✗ ' : ''}${t}</span>`; }

function render() {
  if (!E) return;
  const on = E.ligado, rede = E.rede;
  const ocup = busy.ligar || busy.desligar || busy.rede;
  $('#st').classList.toggle('on', on);
  $('#stT').textContent = ocup ? (busy.desligar ? 'Desligando…' : busy.rede ? 'Reiniciando…' : 'Ligando…') : on ? 'Servidor ligado' : 'Servidor desligado';
  $('#stP').textContent = on ? (rede ? 'Aberto para a sua rede' : 'Só neste computador') : 'O editor não está disponível';
  const b = $('#bTog'); b.disabled = !!ocup; b.classList.toggle('busy', !!ocup);
  $('#bTogT').textContent = on ? 'Desligar' : 'Ligar';
  b.classList.toggle('pri', !on);
  const o = $('#bOpen'); o.disabled = !!(busy.abrir || ocup); o.classList.toggle('busy', !!busy.abrir);
  $('#aLoc').textContent = E.enderecoLocal;
  $('#aRedeBox').classList.toggle('hide', !rede);
  $('#aRede').textContent = E.enderecoRede || '(sem conexão de rede)';
  $('#wRede').classList.toggle('hide', !rede);
  $('#kRede').checked = rede; $('#kRede').disabled = !!ocup; $('#tgRede').classList.toggle('busy', !!busy.rede);
  $('#kIni').checked = E.inicio; $('#kIni').disabled = !!busy.inicio; $('#tgIni').classList.toggle('busy', !!busy.inicio);
  $('#ult').textContent = E.ultima || 'nenhuma ainda';
  const p = E.ping;
  $('#chips').innerHTML = !on ? chip('servidor desligado') : !p ? chip('sem resposta do servidor', false) :
    [chip('Troca de texto', !!p.pymupdf), chip('PDF → Word', !!p.docx), chip('OCR' + (p.idiomas && p.idiomas.length ? ' (' + p.idiomas.join(', ') + ')' : ''), !!p.ocr),
     chip('Office' + (p.office && p.office.length ? ' (' + p.office.join(', ') + ')' : ''), !!(p.office && p.office.length)), chip('Navegador p/ HTML', !!p.navegador)].join('');
}

async function atualiza() {
  try { E = await (await fetch('/api/estado')).json(); render(); } catch (e) { /* painel fechando */ }
}

$('#bTog').onclick = () => E.ligado ? tarefa('desligar', 'desligar') : tarefa('ligar', 'ligar');
$('#bOpen').onclick = () => tarefa('abrir', 'abrir');
$('#kRede').onchange = e => tarefa('rede', 'rede', {valor: e.target.checked});
$('#kIni').onchange = e => tarefa('inicio', 'inicio', {valor: e.target.checked});
document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
  const t = $('#' + b.dataset.copy).textContent;
  try { await navigator.clipboard.writeText(t); msg('Copiado: ' + t); } catch (e) { msg('Não foi possível copiar.'); }
});
document.querySelectorAll('[data-pasta]').forEach(b => b.onclick = () => post('pasta', {qual: b.dataset.pasta}));

function aba_(a) {
  aba = a;
  $('#tLog').classList.toggle('sel', a === 'log'); $('#tVer').classList.toggle('sel', a === 'ver'); $('#tPas').classList.toggle('sel', a === 'pas');
  $('#saida').classList.toggle('hide', a === 'pas'); $('#pastas').classList.toggle('hide', a !== 'pas');
  if (a === 'log') log();
  if (a === 'ver') tarefa('verificar', 'verificar', {}, t => { $('#saida').textContent = t; });
}
async function log() {
  if (aba !== 'log') return;
  const l = (await (await fetch('/api/log')).json()).linhas;
  const el = $('#saida'), fim = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
  el.textContent = l.length ? l.join('\n') : 'Ainda não há registros.';
  if (fim) el.scrollTop = el.scrollHeight;
}
$('#tLog').onclick = () => aba_('log'); $('#tVer').onclick = () => { $('#saida').textContent = 'Verificando…'; aba_('ver'); }; $('#tPas').onclick = () => aba_('pas');

atualiza(); log();
setInterval(atualiza, 2000);
setInterval(log, 4000);
</script>
</body>
</html>
